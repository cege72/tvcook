<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Création d'un nouveau programme culinaire</title>
<style>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Création d'un nouveau programme culinaire</title>
<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-top: 0;
    margin-bottom: 25px;
    color: #2c3e50;
    text-align: center;
}

fieldset {
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 20px;
    background-color: #fafafa;
}

legend {
    font-weight: bold;
    color: #2c3e50;
    padding: 0 10px;
}

.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
}

.form-row:last-child {
    margin-bottom: 0;
}

label {
    width: 220px;
    font-weight: 600;
    flex-shrink: 0;
}

input,
select {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 4px rgba(37, 99, 235, 0.3);
}

.small {
    width: 100px;
    flex: none;
}

.info {
    color: #666;
    font-size: 0.9em;
    white-space: nowrap;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

button[type="button"] {
    background-color: #6b7280;
    color: white;
    margin-bottom: 15px;
}

button[type="button"]:hover {
    background-color: #4b5563;
}

button[type="submit"] {
    background-color: #2563eb;
    color: white;
}

button[type="submit"]:hover {
    background-color: #1d4ed8;
}

.actions {
    margin-top: 25px;
    text-align: right;
}

.hidden {
    display: none;
}

@media (max-width: 768px) {
    .form-row {
        flex-direction: column;
        align-items: stretch;
    }

    label {
        width: auto;
    }

    .small {
        width: 100%;
    }

    .actions {
        text-align: center;
    }
}
</style>
<script src="js/javascript.js defer">
</head>
<body>
<div class="container">
    <h1>Création d'un nouveau programme culinaire</h1>
    <form>
        <fieldset>
            <legend>Quoi/Où/Par qui</legend>
            <div class="form-row">
                <label for="emission">Emission</label>
                <select id="emission">
                    <option>A table ! Saison 2</option>
                </select>
            </div>
            <div class="form-row">
                <label for="titre">Titre</label>
                <input type="text" id="titre" value="Episode n°1">
            </div>
            <div class="form-row">
                <label for="presentateur">Présentateur</label>
                <select id="presentateur">
                    <option>Ronald FASTBOUF</option>
                </select>
            </div>
            <div class="form-row">
                <label for="chroniqueurs">Chroniqueurs</label>
                <select id="chroniqueurs">
                    <option>Choisir les chroniqueurs</option>
                </select>
            </div>
            <div class="form-row">
                <label for="studio">Studio TV</label>
                <select id="studio">
                    <option>Arc de Seine Bt C</option>
                </select>
                <span class="info">130 places</span>
            </div>
        </fieldset>
        <fieldset>
            <legend>Caractéristiques</legend>
            <div class="form-row">
                <label for="duree">Durée en minutes</label>
                <input class="small" type="number" id="duree" value="90">
            </div>
            <div class="form-row">
                <label for="enregistrement">Date Enregistrement</label>
                <input type="date" id="enregistrement" value="2025-03-30">
            </div>
            <div class="form-row">
                <label for="diffusion">Date 1ère diffusion</label>
                <input type="date" id="diffusion" value="2025-06-01">
            </div>
            <div class="form-row">
                <label for="public">Nombre de places public</label>
                <input class="small" type="number" id="public" value="115">
            </div>
            <div class="form-row">
                <label for="vip">Nombre de places VIP</label>
                <input class="small" type="number" id="vip" value="15">
            </div>
        </fieldset>
        <fieldset id="contenu">
            <legend>Contenus</legend>
            <div class="form-row">
                <label for="themes">Thèmes abordés</label>
                <select id="themes">
                    <option>Choisir les thèmes</option>
                </select>
            </div>
            <div class="form-row">
                <label for="recettes">Recettes présentées</label>
                <select id="recettes">
                    <option>Choisir les recettes</option>
                </select>
            </div>
            <div class="form-row">
                <label for="reportages">Reportages diffusés</label>
                <select id="reportages">
                    <option>Choisir les reportages</option>
                </select>
            </div>
        </fieldset>
<button type="button" onclick="toggleContenus()">
    			Masquer les contenus
</button>
        <div class="actions">
            <button type="submit">Valider la création</button>
        </div>
    </form>
</div>
</body>
</html>
